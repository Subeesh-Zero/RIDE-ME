<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riding Squad - Live Location Sharing</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --bg: #06060d;
            --surface: #111118;
            --surface-2: #1a1a24;
            --surface-3: #222230;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.5);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.5);
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2a2a38;
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── LOBBY SCREEN ─────────────────────────── */
        #lobby-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            z-index: 10;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        #lobby-screen .lobby-icon {
            font-size: 5rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px var(--accent-glow));
            line-height: 1;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-14px);
            }
        }
        #lobby-screen .title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #f59e0b, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 18px rgba(245, 158, 11, 0.6));
            line-height: 1.1;
        }
        #lobby-screen .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: -8px;
        }
        .lobby-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 320px;
            margin-top: 8px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 28px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: inherit;
            letter-spacing: 0.3px;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-create {
            background: var(--accent);
            color: #0a0a0f;
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow), 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: pulse-glow 2.5s ease-in-out infinite;
        }
        .btn-create:hover {
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.8), 0 6px 28px rgba(0, 0, 0, 0.6);
            transform: translateY(-2px);
        }
        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 0 30px var(--accent-glow), 0 4px 20px rgba(0, 0, 0, 0.5);
            }
            50% {
                box-shadow: 0 0 50px rgba(245, 158, 11, 0.75), 0 6px 24px rgba(0, 0, 0, 0.55);
            }
        }
        .btn-join {
            background: transparent;
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow), 0 4px 16px rgba(0, 0, 0, 0.4);
            animation: pulse-glow-blue 3s ease-in-out infinite;
        }
        .btn-join:hover {
            background: rgba(59, 130, 246, 0.08);
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.7), 0 6px 24px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }
        @keyframes pulse-glow-blue {
            0%,
            100% {
                box-shadow: 0 0 20px var(--primary-glow), 0 4px 16px rgba(0, 0, 0, 0.4);
            }
            50% {
                box-shadow: 0 0 35px rgba(59, 130, 246, 0.65), 0 6px 20px rgba(0, 0, 0, 0.45);
            }
        }

        /* ── MODAL OVERLAY ────────────────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            animation: slideUp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .modal-card .modal-icon {
            text-align: center;
            font-size: 2.5rem;
        }
        .input-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-field label {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-secondary);
        }
        .input-field input {
            background: var(--surface-2);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all var(--transition);
            letter-spacing: 0.5px;
        }
        .input-field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
            background: var(--surface-3);
        }
        .input-field input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }
        .modal-actions .btn {
            flex: 1;
            padding: 12px 16px;
            font-size: 0.85rem;
            border-radius: 50px;
        }
        .btn-submit {
            background: var(--accent);
            color: #0a0a0f;
            border-color: var(--accent);
        }
        .btn-submit:hover {
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .btn-cancel {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border);
        }
        .btn-cancel:hover {
            border-color: var(--text-muted);
            color: var(--text);
        }
        .btn-danger-modal {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }
        .btn-danger-modal:hover {
            box-shadow: 0 0 30px var(--danger-glow);
        }
        .btn-submit:disabled {
            opacity: 0.5;
            pointer-events: none;
            cursor: not-allowed;
        }

        /* ── GPS LOADING INDICATOR ────────────────── */
        .gps-loading {
            display: none;
            align-items: center;
            gap: 8px;
            justify-content: center;
            padding: 8px;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.85rem;
            animation: pulse-text 1.5s ease-in-out infinite;
        }
        .gps-loading.visible {
            display: flex;
        }
        .gps-spinner {
            width: 16px;
            height: 16px;
            border: 3px solid rgba(245, 158, 11, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes pulse-text {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* ── MAP SCREEN ───────────────────────────── */
        #map-screen {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 5;
        }
        #map-screen.active {
            display: block;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .map-header {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(17, 17, 24, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            justify-content: center;
            transition: all var(--transition);
        }
        .map-header .room-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .map-header .room-code-badge {
            background: var(--surface-3);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 0.85rem;
            animation: subtle-glow 3s ease-in-out infinite;
        }
        @keyframes subtle-glow {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(245, 158, 11, 0.3);
            }
            50% {
                box-shadow: 0 0 18px rgba(245, 158, 11, 0.55);
            }
        }
        .map-header .player-count {
            background: var(--surface-3);
            border-radius: 50px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .map-header .player-count .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: blink-dot 1.5s ease-in-out infinite;
        }
        @keyframes blink-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }
        .map-header .header-btn {
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all var(--transition);
            font-family: inherit;
            letter-spacing: 0.5px;
            white-space: nowrap;
            background: transparent;
        }
        .btn-leave {
            color: #f59e0b;
            border-color: #f59e0b;
        }
        .btn-leave:hover {
            background: rgba(245, 158, 11, 0.1);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }
        .btn-close-room {
            color: #fff;
            background: var(--danger) !important;
            border-color: var(--danger);
        }
        .btn-close-room:hover {
            box-shadow: 0 0 28px var(--danger-glow);
        }

        /* ── CUSTOM MARKER (injected via JS) ──────── */
        .custom-marker {
            background: transparent !important;
            border: none !important;
        }

        /* ── TOAST ────────────────────────────────── */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 11px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                toastOut 0.3s 3s ease forwards;
            pointer-events: auto;
            max-width: 350px;
            text-align: center;
        }
        .toast.error {
            background: #ef4444;
        }
        .toast.success {
            background: #10b981;
        }
        .toast.info {
            background: #3b82f6;
        }
        .toast.warning {
            background: #f59e0b;
            color: #0a0a0f;
        }
        @keyframes toastIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes toastOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(120%);
                opacity: 0;
            }
        }

        /* ── RESPONSIVE ───────────────────────────── */
        @media (max-width: 600px) {
            .map-header {
                top: 8px;
                padding: 8px 12px;
                gap: 8px;
                border-radius: 40px;
                font-size: 0.75rem;
            }
            .map-header .room-code-badge {
                padding: 4px 10px;
                font-size: 0.7rem;
                letter-spacing: 1.5px;
            }
            .map-header .header-btn {
                padding: 6px 12px;
                font-size: 0.7rem;
            }
            .modal-card {
                padding: 20px 16px;
                gap: 12px;
            }
            .btn {
                padding: 13px 22px;
                font-size: 0.9rem;
            }
            #lobby-screen .title {
                font-size: 1.7rem;
            }
            #lobby-screen .lobby-icon {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- ═══════════ LOBBY SCREEN ═══════════════════ -->
    <div id="lobby-screen">
        <div class="lobby-icon">🏍️</div>
        <h1 class="title">RIDING SQUAD</h1>
        <p class="subtitle">Real-Time Location Sharing</p>
        <div class="lobby-buttons">
            <button class="btn btn-create" id="btnCreateRoom">
                <i class="fa-solid fa-plus"></i> Create Room
            </button>
            <button class="btn btn-join" id="btnJoinRoom">
                <i class="fa-solid fa-right-to-bracket"></i> Join Room
            </button>
        </div>
    </div>

    <!-- ═══════════ CREATE ROOM MODAL ══════════════ -->
    <div class="modal-overlay" id="createModal">
        <div class="modal-card">
            <div class="modal-icon">🛡️</div>
            <h3>Create Your Squad</h3>
            <div class="input-field">
                <label>Your Name</label>
                <input type="text" id="createName" placeholder="Enter your rider name" maxlength="30" autocomplete="off" />
            </div>
            <div class="input-field">
                <label>8-Digit Room Password</label>
                <input type="password" id="createPassword" placeholder="Create an 8-digit numeric password"
                maxlength="8" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
            </div>
            <div class="gps-loading" id="createGpsLoading">
                <span class="gps-spinner"></span> Acquiring GPS location...
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelCreate">Cancel</button>
                <button class="btn btn-submit" id="submitCreate">Create Squad</button>
            </div>
        </div>
    </div>

    <!-- ═══════════ JOIN ROOM MODAL ════════════════ -->
    <div class="modal-overlay" id="joinModal">
        <div class="modal-card">
            <div class="modal-icon">🔑</div>
            <h3>Join Existing Squad</h3>
            <div class="input-field">
                <label>Your Name</label>
                <input type="text" id="joinName" placeholder="Enter your rider name" maxlength="30" autocomplete="off" />
            </div>
            <div class="input-field">
                <label>Room ID</label>
                <input type="text" id="joinRoomId" placeholder="Enter the 6-character Room ID"
                maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:2px;" />
            </div>
            <div class="input-field">
                <label>8-Digit Room Password</label>
                <input type="password" id="joinPassword" placeholder="Enter the 8-digit password"
                maxlength="8" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
            </div>
            <div class="gps-loading" id="joinGpsLoading">
                <span class="gps-spinner"></span> Acquiring GPS location...
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelJoin">Cancel</button>
                <button class="btn btn-submit" id="submitJoin">Join Squad</button>
            </div>
        </div>
    </div>

    <!-- ═══════════ CONFIRM CLOSE ROOM MODAL ═══════ -->
    <div class="modal-overlay" id="confirmCloseModal">
        <div class="modal-card">
            <div class="modal-icon">⚠️</div>
            <h3>Close This Room?</h3>
            <p style="text-align:center;color:var(--text-secondary);font-size:0.9rem;">
                This will permanently delete the room and kick out <strong>all members</strong>.
                This action cannot be undone.
            </p>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelClose">Go Back</button>
                <button class="btn btn-danger-modal" id="confirmClose">Yes, Delete Room</button>
            </div>
        </div>
    </div>

    <!-- ═══════════ MAP SCREEN ════════════════════ -->
    <div id="map-screen">
        <div id="map"></div>
        <div class="map-header" id="mapHeader">
            <div class="room-info">
                <span style="color:var(--text-secondary);">Room:</span>
                <span class="room-code-badge" id="mapRoomCode">------</span>
            </div>
            <div class="player-count">
                <span class="dot"></span>
                <span>Riders: <strong id="mapPlayerCount">0</strong></span>
            </div>
            <button class="header-btn btn-close-room" id="btnCloseRoom" style="display:none;">
                <i class="fa-solid fa-skull"></i> Close Room
            </button>
            <button class="header-btn btn-leave" id="btnLeaveRoom" style="display:none;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Leave
            </button>
        </div>
    </div>

    <!-- ═══════════ TOAST CONTAINER ═══════════════ -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ═══════════ SCRIPTS ═══════════════════════ -->
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Firebase Modular SDK v10 -->

        // ─── CONSTANTS ──────────────────────────────────
        const LEADER_COLOR = '#ef4444'; // Red for leader
        const MEMBER_COLORS = [

        // ─── APPLICATION STATE ─────────────────────────
        let currentRoomId = null;
        let currentPlayerKey = null; // sanitized name used as Firebase key
        let currentDisplayName = null;
        let currentColor = null;
        let isLeader = false;
        let geoWatchId = null;
        let roomUnsubscribe = null;
        let onDisconnectRef = null;
        let markersMap = new Map(); // playerKey -> L.marker
        let isLeaving = false;

        // ─── LEAFLET MAP INIT ─────────────────────────
        const map = L.map('map', {
            center: [20.5937, 78.9629],
            zoom: 5,
            zoomControl: true,
            attributionControl: true,
        });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            maxZoom: 19,
        }).addTo(map);

        function invalidateMapSize() {
            setTimeout(() => map.invalidateSize(), 250);
        }
        window.addEventListener('resize', () => map.invalidateSize());

        // ─── TOAST HELPER ──────────────────────────────
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 3300);
        }

        // ─── SANITIZE NAME FOR FIREBASE KEY ────────────
        function sanitizeName(name) {
            return name.trim().replace(/[\.\$\#\[\]\/]/g, '_').replace(/\s+/g, '_');
        }

        // ─── GENERATE ROOM ID ──────────────────────────
        function generateRoomId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // ─── GET CURRENT POSITION (PROMISE) ────────────
        function getCurrentPositionPromise(options = {}) {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('Geolocation not supported'));
                    return;
                }
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: true,
                    timeout: options.timeout || 8000,
                    maximumAge: 0,
                });
            });
        }

        // ─── SCREEN MANAGEMENT ─────────────────────────
        function showLobby() {
            mapScreen.classList.remove('active');
            lobbyScreen.style.display = 'flex';
            invalidateMapSize();
        }

        function showMapScreen() {
            lobbyScreen.style.display = 'none';
            mapScreen.classList.add('active');
            invalidateMapSize();
        }

        function hideAllModals() {
            createModal.classList.remove('active');
            joinModal.classList.remove('active');
            confirmCloseModal.classList.remove('active');
            createGpsLoading.classList.remove('visible');
            joinGpsLoading.classList.remove('visible');
        }

        // ─── BUILD CUSTOM MARKER HTML ──────────────────
        function buildMarkerHTML(color, initial, isLeaderMarker, isSelf) {
            const size = isLeaderMarker ? 38 : 32;
            const borderWidth = isSelf ? 4 : 3;
            const borderColor = isSelf ? '#ffffff' : 'rgba(255,255,255,0.85)';
            const shadowBlur = isSelf ? 18 : 10;
            const pulseAnim = isSelf ? 'markerPulse 2s ease-in-out infinite' : 'none';
            const crownHTML = isLeaderMarker ?
                '<span style="position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:16px;filter:drop-shadow(0 0 4px rgba(0,0,0,0.6));">👑</span>' :
                '';

            return `
            <div style="
              width:${size}px;
              height:${size}px;
              border-radius:50%;
              background:${color};
              border:${borderWidth}px solid ${borderColor};
              box-shadow: 0 0 ${shadowBlur}px ${color}, 0 3px 12px rgba(0,0,0,0.55);
              animation: ${pulseAnim};
              position:relative;
              display:flex;
              align-items:center;
              justify-content:center;
              font-weight:900;
              font-size:${size * 0.4}px;
              color:#fff;
              text-shadow: 0 1px 2px rgba(0,0,0,0.5);
              letter-spacing:0;
              line-height:1;
            ">
              ${crownHTML}
              ${initial}
            </div>`;
        }

        // Inject marker pulse keyframes
        const pulseStyleEl = document.createElement('style');
        pulseStyleEl.textContent = `
          @keyframes markerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.16); }
          }
        `;
        document.head.appendChild(pulseStyleEl);

        // ─── UPSERT MARKER ON MAP ──────────────────────
        function upsertMarker(playerKey, displayName, lat, lng, color, isLeaderMarker, isSelf) {
            if (lat == null || lng == null || isNaN(lat) || isNaN(lng)) return;

            const initial = (displayName || playerKey).charAt(0).toUpperCase();
            const size = isLeaderMarker ? 38 : 32;

            if (markersMap.has(playerKey)) {
                // Update existing marker
                const marker = markersMap.get(playerKey);
                marker.setLatLng([lat, lng]);
                const label = isSelf ? `${displayName} (You)` : displayName;
                const tooltipLabel = (isLeaderMarker && !isSelf) ? `👑 ${label}` : label;
                marker.setTooltipContent(tooltipLabel);
                marker.setIcon(
                    L.divIcon({
                        html: buildMarkerHTML(color, initial, isLeaderMarker, isSelf),
                        className: 'custom-marker',
                        iconSize: [size + 6, size + 6],
                        iconAnchor: [(size + 6) / 2, (size + 6) / 2],
                        tooltipAnchor: [0, -(size + 6) / 2 - 6],
                    })
                );
            } else {
                // Create new marker
                const icon = L.divIcon({
                    html: buildMarkerHTML(color, initial, isLeaderMarker, isSelf),
                    className: 'custom-marker',
                    iconSize: [size + 6, size + 6],
                    iconAnchor: [(size + 6) / 2, (size + 6) / 2],
                    tooltipAnchor: [0, -(size + 6) / 2 - 6],
                });
                const label = isSelf ? `${displayName} (You)` : displayName;
                const tooltipLabel = (isLeaderMarker && !isSelf) ? `👑 ${label}` : label;

                const marker = L.marker([lat, lng], { icon })
                    .addTo(map)
                    .bindTooltip(tooltipLabel, {
                        permanent: false,
                        direction: 'top',
                        offset: [0, -(size + 6) / 2],
                        opacity: 0.95,
                    });
                markersMap.set(playerKey, marker);
            }
        }

        // ─── REMOVE SINGLE MARKER ──────────────────────
        function removeMarker(playerKey) {
            if (markersMap.has(playerKey)) {
                map.removeLayer(markersMap.get(playerKey));
                markersMap.delete(playerKey);
            }
        }

        // ─── CLEAR ALL MARKERS ─────────────────────────
        function clearAllMarkers() {
            for (const [key, marker] of markersMap) {
                map.removeLayer(marker);
            }
            markersMap.clear();
        }

        // ─── FIT MAP TO ALL MARKERS ────────────────────
        function fitMapToMarkers() {
            if (markersMap.size === 0) return;
            const bounds = [];
            for (const marker of markersMap.values()) {
                bounds.push(marker.getLatLng());
            }
            if (bounds.length === 1) {
                map.setView(bounds[0], 17, { animate: true });
            } else {
                map.fitBounds(L.latLngBounds(bounds), {
                    padding: [60, 60],
                    maxZoom: 16,
                    animate: true,
                });
            }
        }

        // ─── SETUP ROOM LISTENER ───────────────────────
        function setupRoomListener(roomId) {
            // Unsubscribe any previous listener
            if (roomUnsubscribe) {
                roomUnsubscribe();
                roomUnsubscribe = null;
            }

            // Listen EXACTLY on /rooms/{roomID}/players
            const playersRef = ref(db, `rooms/${roomId}/players`);

            roomUnsubscribe = onValue(playersRef, (snapshot) => {
                if (isLeaving) return;

                const playersData = snapshot.val();

                // If null, the room may have been deleted or no players exist
                if (playersData === null) {
                    // Check if the room itself still exists
                    get(ref(db, `rooms/${roomId}`)).then((roomSnap) => {
                        if (!roomSnap.exists() && !isLeaving) {
                            console.log('🚫 Room has been deleted — returning to lobby.');
                            showToast('The room has been closed by the leader.', 'warning');
                            forceReturnToLobby();
                        } else if (!isLeaving) {
                            // Room exists but no players — clear all markers
                            const staleKeys = new Set(markersMap.keys());
                            staleKeys.forEach(k => removeMarker(k));
                            mapPlayerCount.textContent = '0';
                        }
                    }).catch(() => {});
                    return;
                }

                // Track which player keys are present in the latest data
                const activePlayerKeys = new Set();
                const leaderName = currentRoomId ? null : null; // We'll determine leader from data

                for (const [playerKey, playerData] of Object.entries(playersData)) {
                    if (playerData && typeof playerData.lat === 'number' && typeof playerData.lng === 'number') {
                        activePlayerKeys.add(playerKey);
                        const displayName = playerData.displayName || playerKey;
                        const color = playerData.color || MEMBER_COLORS[0];
                        const isLeaderMarker = (playerData.role === 'leader');
                        const isSelf = (playerKey === currentPlayerKey);
                        upsertMarker(playerKey, displayName, playerData.lat, playerData.lng, color, isLeaderMarker,
                            isSelf);
                    }
                }

                // Remove markers for players no longer in the room
                const currentMarkerKeys = new Set(markersMap.keys());
                for (const existingKey of currentMarkerKeys) {
                    if (!activePlayerKeys.has(existingKey)) {
                        removeMarker(existingKey);
                    }
                }

                // Update player count
                mapPlayerCount.textContent = activePlayerKeys.size;

                // Fit map bounds
                fitMapToMarkers();

                // Update leader status for current user
                if (currentPlayerKey && playersData[currentPlayerKey]) {
                    const myData = playersData[currentPlayerKey];
                    if (myData.role === 'leader') {
                        isLeader = true;
                        btnCloseRoom.style.display = 'inline-flex';
                        btnLeaveRoom.style.display = 'none';
                    } else {
                        isLeader = false;
                        btnCloseRoom.style.display = 'none';
                        btnLeaveRoom.style.display = 'inline-flex';
                    }
                }

                console.log(`📍 Room update: ${activePlayerKeys.size} riders online`);
            }, (error) => {
                console.error('❌ Room listener error:', error);
                if (!isLeaving) {
                    showToast('Connection error. Check console.', 'error');
                }
            });
        }

        // ─── FORCE RETURN TO LOBBY ────────────────────
        function forceReturnToLobby() {
            stopTracking();
            if (roomUnsubscribe) {
                roomUnsubscribe();
                roomUnsubscribe = null;
            }
            if (onDisconnectRef) {
                onDisconnectRef.cancel().catch(() => {});
                onDisconnectRef = null;
            }
            clearAllMarkers();
            currentRoomId = null;
            currentPlayerKey = null;
            currentDisplayName = null;
            currentColor = null;
            isLeader = false;
            mapPlayerCount.textContent = '0';
            mapRoomCode.textContent = '------';
            btnCloseRoom.style.display = 'none';
            btnLeaveRoom.style.display = 'none';
            showLobby();
            hideAllModals();
            isLeaving = false;
        }

        // ─── STOP TRACKING ────────────────────────────
        function stopTracking() {
            if (geoWatchId !== null) {
                navigator.geolocation.clearWatch(geoWatchId);
                geoWatchId = null;
                console.log('🛑 Geolocation watch stopped.');
            }
        }

        // ─── START WATCHING POSITION ───────────────────
        function startWatchingPosition(roomId, playerKey, displayName, color, role) {
            if (!navigator.geolocation) {
                showToast('Geolocation not supported by your browser.', 'error');
                return false;
            }

            stopTracking();

            const playerRef = ref(db, `rooms/${roomId}/players/${playerKey}`);

            // Schedule cleanup on disconnect
            if (onDisconnectRef) {
                onDisconnectRef.cancel().catch(() => {});
            }
            onDisconnectRef = onDisconnect(playerRef);
            onDisconnectRef.remove().then(() => {
                console.log('🔌 onDisconnect scheduled for:', playerKey);
            }).catch((err) => {
                console.warn('⚠️ onDisconnect setup warning:', err);
            });

            geoWatchId = navigator.geolocation.watchPosition(
                (position) => {
                    const { latitude, longitude, accuracy } = position.coords;
                    update(playerRef, {
                        lat: latitude,
                        lng: longitude,
                        accuracy: accuracy,
                        displayName: displayName,
                        color: color,
                        role: role,
                        updatedAt: Date.now(),
                    }).then(() => {
                        // Hide GPS loading if visible
                        createGpsLoading.classList.remove('visible');
                        joinGpsLoading.classList.remove('visible');
                    }).catch((err) => {
                        console.error('❌ Error updating location:', err);
                    });

                    // If only this user on map, center on them
                    if (markersMap.size <= 1 && markersMap.has(playerKey)) {
                        map.setView([latitude, longitude], 17, { animate: true });
                    }
                },
                (error) => {
                    console.error('❌ Geolocation watch error:', error);
                    let msg = 'Location error. ';
                    switch (error.code) {
                        case error.PERMISSION_DENIED:
                            msg += 'Please allow location access in browser settings.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            msg += 'Position unavailable. Waiting for GPS...';
                            break;
                        case error.TIMEOUT:
                            msg += 'GPS request timed out. Retrying...';
                            break;
                        default:
                            msg += 'Unknown error. Retrying...';
                    }
                    showToast(msg, 'warning');
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 5000,
                }
            );

            console.log('📍 Watching position for:', displayName, 'in room:', roomId, 'role:', role);
            return true;
        }

        // ─── SAVE INITIAL POSITION ─────────────────────
        async function saveInitialPosition(roomId, playerKey, displayName, color, role) {
            try {
                const position = await getCurrentPositionPromise({ timeout: 8000 });
                const { latitude, longitude, accuracy } = position.coords;
                await set(ref(db, `rooms/${roomId}/players/${playerKey}`), {
                    lat: latitude,
                    lng: longitude,
                    accuracy: accuracy,
                    displayName: displayName,
                    color: color,
                    role: role,
                    updatedAt: Date.now(),
                });
                console.log('📍 Initial position saved for:', displayName);
                return true;
            } catch (err) {
                console.warn('⚠️ Could not get initial position:', err.message);
                // Still save a placeholder so the player appears (with 0,0 or approximate)
                // The watchPosition will update it soon
                if (err.code === err.PERMISSION_DENIED) {
                    showToast('Location permission denied. Please enable GPS.', 'error');
                    return false;
                }
                // Timeout or unavailable — save a pending entry
                await set(ref(db, `rooms/${roomId}/players/${playerKey}`), {
                    lat: 0,
                    lng: 0,
                    accuracy: 9999,
                    displayName: displayName,
                    color: color,
                    role: role,
                    updatedAt: Date.now(),
                    pending: true,
                });
                showToast('GPS is initializing. Your location will update shortly.', 'info');
                return true;
            }
        }

        // ─── ASSIGN COLOR FOR NEW PLAYER ───────────────
        function assignColorForPlayer(existingPlayers, isLeaderPlayer) {
            if (isLeaderPlayer) return LEADER_COLOR;
            const usedColors = new Set();
            if (existingPlayers) {
                for (const playerData of Object.values(existingPlayers)) {
                    if (playerData && playerData.color) {
                        usedColors.add(playerData.color);
                    }
                }
            }
            // Remove leader color from consideration
            usedColors.add(LEADER_COLOR);
            for (const color of MEMBER_COLORS) {
                if (!usedColors.has(color)) return color;
            }
            // If all colors used, pick a random member color
            return MEMBER_COLORS[Math.floor(Math.random() * MEMBER_COLORS.length)];
        }

        // ─── REMOVE PLAYER FROM ROOM ──────────────────
        async function removePlayerFromRoom(roomId, playerKey) {
            const playerRef = ref(db, `rooms/${roomId}/players/${playerKey}`);
            try {
                if (onDisconnectRef) {
                    await onDisconnectRef.cancel().catch(() => {});
                    onDisconnectRef = null;
                }
                await remove(playerRef);
                console.log('🗑️ Player removed:', playerKey);
            } catch (err) {
                console.error('❌ Error removing player:', err);
            }
        }

        // ─── LEAVE ROOM (MEMBER) ──────────────────────
        async function leaveRoom() {
            if (isLeaving) return;
            isLeaving = true;
            const roomId = currentRoomId;
            const playerKey = currentPlayerKey;
            stopTracking();
            if (roomUnsubscribe) {
                roomUnsubscribe();
                roomUnsubscribe = null;
            }
            if (roomId && playerKey) {
                await removePlayerFromRoom(roomId, playerKey);
            }
            clearAllMarkers();
            currentRoomId = null;
            currentPlayerKey = null;
            currentDisplayName = null;
            currentColor = null;
            isLeader = false;
            mapPlayerCount.textContent = '0';
            mapRoomCode.textContent = '------';
            btnCloseRoom.style.display = 'none';
            btnLeaveRoom.style.display = 'none';
            onDisconnectRef = null;
            isLeaving = false;
            showLobby();
            hideAllModals();
            showToast('You have left the room.', 'info');
            console.log('👋 Left room successfully.');
        }

        // ─── CLOSE ROOM (LEADER) ──────────────────────
        async function closeRoom() {
            if (isLeaving) return;
            isLeaving = true;
            const roomId = currentRoomId;
            stopTracking();
            if (roomUnsubscribe) {
                roomUnsubscribe();
                roomUnsubscribe = null;
            }
            if (onDisconnectRef) {
                await onDisconnectRef.cancel().catch(() => {});
                onDisconnectRef = null;
            }
            if (roomId) {
                try {
                    await remove(ref(db, `rooms/${roomId}`));
                    console.log('💀 Room deleted:', roomId);
                } catch (err) {
                    console.error('❌ Error deleting room:', err);
                    showToast('Error deleting room. Try again.', 'error');
                    isLeaving = false;
                    return;
                }
            }
            clearAllMarkers();
            currentRoomId = null;
            currentPlayerKey = null;
            currentDisplayName = null;
            currentColor = null;
            isLeader = false;
            mapPlayerCount.textContent = '0';
            mapRoomCode.textContent = '------';
            btnCloseRoom.style.display = 'none';
            btnLeaveRoom.style.display = 'none';
            onDisconnectRef = null;
            isLeaving = false;
            showLobby();
            hideAllModals();
            showToast('Room closed. All members have been removed.', 'success');
            console.log('💀 Room closed successfully.');
        }

        // ─── CREATE ROOM FLOW ─────────────────────────
        async function createRoomFlow() {
            const displayName = createNameInput.value.trim();
            const password = createPasswordInput.value.trim();

            if (!displayName) {
                showToast('Please enter your name.', 'error');
                createNameInput.focus();
                return;
            }
            if (!/^\d{8}$/.test(password)) {
                showToast('Password must be exactly 8 digits (0-9).', 'error');
                createPasswordInput.focus();
                return;
            }

            const playerKey = sanitizeName(displayName);
            if (!playerKey) {
                showToast('Invalid name. Please use valid characters.', 'error');
                return;
            }

            // Disable button and show loading
            submitCreate.disabled = true;
            submitCreate.textContent = 'Creating...';
            createGpsLoading.classList.add('visible');

            // Generate unique room ID
            let roomId;
            let attempts = 0;
            const maxAttempts = 15;
            do {
                roomId = generateRoomId();
                attempts++;
                const roomSnap = await get(ref(db, `rooms/${roomId}`));
                if (!roomSnap.exists()) break;
                if (attempts >= maxAttempts) {
                    showToast('Could not generate unique Room ID. Please try again.', 'error');
                    submitCreate.disabled = false;
                    submitCreate.textContent = 'Create Squad';
                    createGpsLoading.classList.remove('visible');
                    return;
                }
            } while (true);

            // Create room node
            try {
                await set(ref(db, `rooms/${roomId}`), {
                    password: password,
                    leader: displayName,
                    createdAt: Date.now(),
                });
                console.log('🏠 Room created:', roomId);
            } catch (err) {
                console.error('❌ Error creating room:', err);
                showToast('Error creating room. Check Firebase rules.', 'error');
                submitCreate.disabled = false;
                submitCreate.textContent = 'Create Squad';
                createGpsLoading.classList.remove('visible');
                return;
            }

            // Set state
            currentRoomId = roomId;
            currentPlayerKey = playerKey;
            currentDisplayName = displayName;
            currentColor = LEADER_COLOR;
            isLeader = true;

            // Save initial position IMMEDIATELY
            const posSaved = await saveInitialPosition(roomId, playerKey, displayName, LEADER_COLOR, 'leader');

            // Update UI
            mapRoomCode.textContent = roomId;
            btnCloseRoom.style.display = 'inline-flex';
            btnLeaveRoom.style.display = 'none';
            hideAllModals();
            showMapScreen();

            // Start watching for continuous updates
            const trackingOk = startWatchingPosition(roomId, playerKey, displayName, LEADER_COLOR, 'leader');

            // Setup room listener
            setupRoomListener(roomId);

            // Reset button state
            submitCreate.disabled = false;
            submitCreate.textContent = 'Create Squad';
            createGpsLoading.classList.remove('visible');

            if (!posSaved && !trackingOk) {
                showToast('GPS unavailable. Please check location settings.', 'warning');
            } else {
                showToast(`Room "${roomId}" created! Share the code with your squad.`, 'success');
            }
        }

        // ─── JOIN ROOM FLOW ───────────────────────────
        async function joinRoomFlow() {
            const displayName = joinNameInput.value.trim();
            const roomId = joinRoomIdInput.value.trim().toUpperCase();
            const password = joinPasswordInput.value.trim();

            if (!displayName) {
                showToast('Please enter your name.', 'error');
                joinNameInput.focus();
                return;
            }
            if (!roomId || roomId.length !== 6) {
                showToast('Room ID must be exactly 6 characters.', 'error');
                joinRoomIdInput.focus();
                return;
            }
            if (!/^\d{8}$/.test(password)) {
                showToast('Password must be exactly 8 digits (0-9).', 'error');
                joinPasswordInput.focus();
                return;
            }

            const playerKey = sanitizeName(displayName);
            if (!playerKey) {
                showToast('Invalid name. Please use valid characters.', 'error');
                return;
            }

            // Disable button and show loading
            submitJoin.disabled = true;
            submitJoin.textContent = 'Joining...';
            joinGpsLoading.classList.add('visible');

            // Validate room
            let roomData;
            try {
                const roomSnap = await get(ref(db, `rooms/${roomId}`));
                if (!roomSnap.exists()) {
                    showToast('Room not found. Check the Room ID.', 'error');
                    submitJoin.disabled = false;
                    submitJoin.textContent = 'Join Squad';
                    joinGpsLoading.classList.remove('visible');
                    return;
                }
                roomData = roomSnap.val();
            } catch (err) {
                console.error('❌ Error fetching room:', err);
                showToast('Error connecting to database.', 'error');
                submitJoin.disabled = false;
                submitJoin.textContent = 'Join Squad';
                joinGpsLoading.classList.remove('visible');
                return;
            }

            // Validate password
            if (roomData.password !== password) {
                showToast('Incorrect password. Access denied.', 'error');
                submitJoin.disabled = false;
                submitJoin.textContent = 'Join Squad';
                joinGpsLoading.classList.remove('visible');
                return;
            }

            // Check for duplicate name
            const existingPlayers = roomData.players || {};
            if (existingPlayers[playerKey]) {
                showToast('A rider with this name is already in the room. Choose another name.', 'error');
                submitJoin.disabled = false;
                submitJoin.textContent = 'Join Squad';
                joinGpsLoading.classList.remove('visible');
                return;
            }

            // Assign color
            const role = 'member';
            const assignedColor = assignColorForPlayer(existingPlayers, false);

            // Set state
            currentRoomId = roomId;
            currentPlayerKey = playerKey;
            currentDisplayName = displayName;
            currentColor = assignedColor;
            isLeader = false;

            // Save initial position IMMEDIATELY
            const posSaved = await saveInitialPosition(roomId, playerKey, displayName, assignedColor, role);

            // Update UI
            mapRoomCode.textContent = roomId;
            btnCloseRoom.style.display = 'none';
            btnLeaveRoom.style.display = 'inline-flex';
            hideAllModals();
            showMapScreen();

            // Start watching for continuous updates
            const trackingOk = startWatchingPosition(roomId, playerKey, displayName, assignedColor, role);

            // Setup room listener
            setupRoomListener(roomId);

            // Reset button state
            submitJoin.disabled = false;
            submitJoin.textContent = 'Join Squad';
            joinGpsLoading.classList.remove('visible');

            if (!posSaved && !trackingOk) {
                showToast('GPS unavailable. Please check location settings.', 'warning');
            } else {
                showToast(`Joined room "${roomId}"! Ride safe!`, 'success');
            }
            console.log('🚪 Joined room:', roomId, 'color:', assignedColor);
        }

        // ─── EVENT LISTENERS ───────────────────────────
        btnCreateRoom.addEventListener('click', () => {
            if (currentRoomId) {
                showToast('You are already in a room. Leave first.', 'warning');
                return;
            }
            createNameInput.value = '';
            createPasswordInput.value = '';
            createGpsLoading.classList.remove('visible');
            submitCreate.disabled = false;
            submitCreate.textContent = 'Create Squad';
            createModal.classList.add('active');
            setTimeout(() => createNameInput.focus(), 150);
        });

        btnJoinRoom.addEventListener('click', () => {
            if (currentRoomId) {
                showToast('You are already in a room. Leave first.', 'warning');
                return;
            }
            joinNameInput.value = '';
            joinRoomIdInput.value = '';
            joinPasswordInput.value = '';
            joinGpsLoading.classList.remove('visible');
            submitJoin.disabled = false;
            submitJoin.textContent = 'Join Squad';
            joinModal.classList.add('active');
            setTimeout(() => joinNameInput.focus(), 150);
        });

        cancelCreate.addEventListener('click', () => {
            createModal.classList.remove('active');
            createGpsLoading.classList.remove('visible');
            submitCreate.disabled = false;
            submitCreate.textContent = 'Create Squad';
        });
        cancelJoin.addEventListener('click', () => {
            joinModal.classList.remove('active');
            joinGpsLoading.classList.remove('visible');
            submitJoin.disabled = false;
            submitJoin.textContent = 'Join Squad';
        });
        cancelClose.addEventListener('click', () => confirmCloseModal.classList.remove('active'));

        submitCreate.addEventListener('click', createRoomFlow);
        submitJoin.addEventListener('click', joinRoomFlow);

        btnLeaveRoom.addEventListener('click', leaveRoom);
        btnCloseRoom.addEventListener('click', () => {
            confirmCloseModal.classList.add('active');
        });
        confirmClose.addEventListener('click', async () => {
            confirmCloseModal.classList.remove('active');
            await closeRoom();
        });

        // Keyboard shortcuts
        createPasswordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') createRoomFlow();
        });
        createNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') createPasswordInput.focus();
        });
        joinRoomIdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') joinPasswordInput.focus();
        });
        joinPasswordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') joinRoomFlow();
        });
        joinNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') joinRoomIdInput.focus();
        });

        // Restrict password inputs to digits
        [createPasswordInput, joinPasswordInput].forEach(inp => {
            inp.addEventListener('input', () => {
                inp.value = inp.value.replace(/[^0-9]/g, '').slice(0, 8);
            });
        });

        // Restrict room ID input
        joinRoomIdInput.addEventListener('input', () => {
            joinRoomIdInput.value = joinRoomIdInput.value.replace(/[^a-zA-Z0-9]/g, '').slice(0, 6).toUpperCase();
        });

        // Close modals on overlay click
        [createModal, joinModal, confirmCloseModal].forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                    createGpsLoading.classList.remove('visible');
                    joinGpsLoading.classList.remove('visible');
                    submitCreate.disabled = false;
                    submitCreate.textContent = 'Create Squad';
                    submitJoin.disabled = false;
                    submitJoin.textContent = 'Join Squad';
                }
            });
        });

        // Handle browser close
        window.addEventListener('beforeunload', () => {
            stopTracking();
        });

        // Handle tab visibility
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && currentRoomId && currentPlayerKey && !isLeaving) {
                if (!roomUnsubscribe) {
                    console.log('🔄 Re-establishing room listener...');
                    setupRoomListener(currentRoomId);
                }
                if (geoWatchId === null && !isLeaving) {
                    console.log('🔄 Restarting location tracking...');
                    startWatchingPosition(currentRoomId, currentPlayerKey, currentDisplayName, currentColor,
                        isLeader ? 'leader' : 'member');
                }
                invalidateMapSize();
            }
        });

        // ─── INITIAL SETUP ─────────────────────────────
        showLobby();
        hideAllModals();
        mapRoomCode.textContent = '------';
        mapPlayerCount.textContent = '0';
        btnCloseRoom.style.display = 'none';
        btnLeaveRoom.style.display = 'none';

        console.log('🏍️  Riding Squad ready!');
        console.log('📋 Create a room or join with a code to start sharing your location.');
        console.log('🗺️  Map: Leaflet + OpenStreetMap');
        console.log('🔥  Backend: Firebase Realtime Database');
        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        console.log('🐛 BUG FIXES APPLIED:');
        console.log('  1. Leader now saves initial position immediately via getCurrentPosition');
        console.log('  2. Distinct marker colors — Leader=RED, members=get unique colors');
        console.log('  3. GPS: enableHighAccuracy=true, maximumAge=0, timeout=5000');
        console.log('  4. onValue listener on /rooms/{roomID}/players — no duplicate markers');
        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
    </script>
</body>
</html>
