<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riding Squad · VPECom Blue Navbar</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --bg: #06060d;
            --surface-dark: rgba(15, 15, 20, 0.75);
            --vpecom-blue: #1A73E8;
            --accent: #1A73E8;
            --accent-glow: rgba(26, 115, 232, 0.5);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.5);
            --warning: #f97316;
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.5);
            --text: #e2e8f0;
            --text-secondary: #b0bec5;
            --text-muted: #78909c;
            --border-vpecom: rgba(26, 115, 232, 0.3);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── TOP NAVBAR ───────────────────────────── */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: rgba(26, 115, 232, 0.96);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .top-navbar .logo {
            font-weight: 800;
            font-size: 1.2rem;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .top-navbar .menu-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .top-navbar .menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ── NAVBAR DROPDOWN ──────────────────────── */
        .navbar-dropdown {
            position: fixed;
            top: 50px;
            right: 10px;
            background: rgba(26, 115, 232, 0.96);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            z-index: 10001;
            display: none;
            flex-direction: column;
            min-width: 180px;
            padding: 8px 0;
        }
        .navbar-dropdown.visible {
            display: flex;
        }
        .navbar-dropdown a {
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        .navbar-dropdown a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ── MAP SCREEN ───────────────────────────── */
        #map-screen {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 5;
            margin-top: 50px; /* push map below navbar */
        }
        #map-screen.active {
            display: block;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ── MAP HEADER (below navbar) ────────────── */
        .map-header {
            position: absolute;
            top: 15px; /* extra space from navbar edge */
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: var(--surface-dark);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-vpecom);
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            justify-content: center;
            max-width: calc(100vw - 32px);
        }
        .map-header .room-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .map-header .room-code-badge {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid var(--green);
            color: var(--green);
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .copy-room-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--green);
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all var(--transition);
        }
        .copy-room-btn:hover {
            background: rgba(16, 185, 129, 0.18);
            transform: scale(1.15);
            filter: drop-shadow(0 0 6px var(--green-glow));
        }
        .copy-room-btn svg {
            width: 15px;
            height: 15px;
        }
        .map-header .player-count {
            background: rgba(16, 185, 129, 0.1);
            border-radius: 50px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .map-header .player-count .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: blink-dot 1.5s ease-in-out infinite;
        }
        @keyframes blink-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }
        .map-header .header-btn {
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all var(--transition);
            font-family: inherit;
            letter-spacing: 0.5px;
            white-space: nowrap;
            background: transparent;
        }
        .btn-leave {
            color: var(--accent);
            border-color: var(--accent);
        }
        .btn-leave:hover {
            background: rgba(26, 115, 232, 0.1);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .btn-close-room {
            color: #fff;
            background: var(--danger) !important;
            border-color: var(--danger);
        }
        .btn-close-room:hover {
            box-shadow: 0 0 28px var(--danger-glow);
        }

        /* ── GPS WARNING BAR ──────────────────────── */
        .gps-warning-bar {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 998;
            background: rgba(249, 115, 22, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            max-width: calc(100vw - 40px);
        }
        .gps-warning-bar.visible {
            display: flex;
        }

        /* ── SQUAD MEMBERS PANEL (bottom‑left) ────── */
        .leaderboard-panel {
            position: absolute;
            bottom: 28px;
            left: 16px;
            top: auto;
            right: auto;
            z-index: 997;
            background: rgba(15, 15, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-vpecom);
            border-radius: var(--radius);
            padding: 0;
            min-width: 230px;
            max-width: 290px;
            max-height: 48vh;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
            font-size: 0.82rem;
            display: none;
            color: var(--text);
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .leaderboard-panel.visible {
            display: flex;
            flex-direction: column;
        }
        .leaderboard-panel .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(26, 115, 232, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
        }
        .leaderboard-panel .panel-header h4 {
            font-size: 0.92rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .leaderboard-panel .toggle-arrow {
            color: #ffffff;
            font-size: 1rem;
            transition: transform 0.3s;
        }
        .leaderboard-panel.collapsed .toggle-arrow {
            transform: rotate(180deg);
        }
        .leaderboard-panel .panel-content {
            overflow-y: auto;
            max-height: 40vh;
            transition: max-height 0.3s ease, opacity 0.2s;
        }
        .leaderboard-panel.collapsed .panel-content {
            max-height: 0;
            opacity: 0;
        }
        .leaderboard-panel .search-container {
            padding: 10px 16px 8px;
            display: none;
        }
        .leaderboard-panel .search-container.visible {
            display: block;
        }
        .leaderboard-panel .search-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 0.78rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .leaderboard-panel .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.3);
        }
        .leaderboard-list {
            padding: 0 16px 12px;
        }
        .leaderboard-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            gap: 8px;
            min-height: 42px;
        }
        .leaderboard-item .rider-name {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #FFFFFF;
            font-size: 0.84rem;
        }
        .leaderboard-item .rider-name .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            box-shadow: 0 0 6px currentColor;
        }
        .leaderboard-item .distance {
            font-weight: 700;
            color: var(--green);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 0.8rem;
        }
        .leaderboard-item .distance.nearby {
            color: #10b981;
        }
        /* ── EYE ICON (white, active blue) ────────── */
        .eye-icon {
            cursor: pointer;
            color: #FFFFFF;
            transition: all var(--transition);
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: transparent;
        }
        .eye-icon:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.15);
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6));
        }
        .eye-icon.active {
            color: #FFFFFF;
            filter: drop-shadow(0 0 10px rgba(26, 115, 232, 0.9));
            background: rgba(26, 115, 232, 0.25);
        }
        .eye-icon svg {
            width: 15px;
            height: 15px;
            display: block;
        }
        .leaderboard-item.self {
            background: rgba(26, 115, 232, 0.08);
            border-radius: 6px;
        }
        .leaderboard-item.self .distance {
            color: var(--accent);
            font-weight: 800;
        }

        /* ── FAB: VIEW ALL (VPECom blue glass) ───── */
        .fab-view-all {
            position: absolute;
            bottom: 28px;
            right: 24px;
            z-index: 999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(26, 115, 232, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(26, 115, 232, 0.5), 0 2px 8px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .fab-view-all:hover {
            background: rgba(26, 115, 232, 0.95);
            box-shadow: 0 8px 30px rgba(26, 115, 232, 0.75), 0 4px 12px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px) scale(1.04);
        }
        .fab-view-all:active {
            transform: scale(0.92);
            box-shadow: 0 3px 12px rgba(26, 115, 232, 0.4);
        }
        .fab-view-all svg {
            width: 22px;
            height: 22px;
            display: block;
            stroke: white;
        }

        /* ── CUSTOM MARKER SMOOTH SLIDING ──────────── */
        .custom-marker {
            background: transparent !important;
            border: none !important;
        }
        .smooth-marker-move {
            transition: transform 2.5s linear, opacity 0.3s;
        }
        body.map-interacting .smooth-marker-move {
            transition: none !important;
        }

        /* ── TOAST ────────────────────────────────── */
        .toast-container {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 11px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                toastOut 0.3s 3.2s ease forwards;
            pointer-events: auto;
            max-width: 350px;
            text-align: center;
        }
        .toast.error {
            background: #ef4444;
        }
        .toast.success {
            background: #10b981;
        }
        .toast.info {
            background: #3b82f6;
        }
        .toast.warning {
            background: #f59e0b;
            color: #0a0a0f;
        }
        @keyframes toastIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes toastOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(120%);
                opacity: 0;
            }
        }

        /* ── LOBBY SCREEN (unchanged) ─────────────── */
        #lobby-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            z-index: 10;
            padding: 20px;
            text-align: center;
            position: fixed;
            inset: 0;
            background: var(--bg);
        }
        #lobby-screen .lobby-icon {
            font-size: 5rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px var(--accent-glow));
            line-height: 1;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-14px);
            }
        }
        #lobby-screen .title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #1A73E8, #A8D1FF, #1A73E8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 18px var(--accent-glow));
            line-height: 1.1;
        }
        #lobby-screen .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: -8px;
        }
        .lobby-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 320px;
            margin-top: 8px;
        }
        .lobby-buttons .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: inherit;
            letter-spacing: 0.3px;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-create {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow), 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .btn-create:hover {
            box-shadow: 0 0 50px rgba(26, 115, 232, 0.8), 0 6px 28px rgba(0, 0, 0, 0.6);
            transform: translateY(-2px);
        }
        .btn-join {
            background: transparent;
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .btn-join:hover {
            background: rgba(26, 115, 232, 0.08);
            box-shadow: 0 0 40px rgba(26, 115, 232, 0.7), 0 6px 24px rgba(0, 0, 0, 0.5);
        }

        /* modal styles (unchanged, reused) */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-card {
            background: var(--surface-dark);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-vpecom);
            border-radius: var(--radius);
            padding: 28px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            color: #FFFFFF;
        }
        .input-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-field label {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        .input-field input {
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            color: #FFFFFF;
            font-size: 1rem;
            outline: none;
        }
        .input-field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.15);
            background: rgba(255, 255, 255, 0.1);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }
        .modal-actions .btn {
            flex: 1;
            padding: 12px 16px;
            font-size: 0.85rem;
            border-radius: 50px;
        }
        .btn-submit {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-cancel {
            background: transparent;
            color: var(--text-secondary);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .btn-danger-modal {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }
        .btn-submit:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- ═══════════ TOP NAVBAR ══════════════════════ -->
    <nav class="top-navbar">
        <div class="logo">Ride me</div>
        <button class="menu-btn" id="navbarMenuBtn"><i class="fa-solid fa-bars"></i></button>
    </nav>
    <div class="navbar-dropdown" id="navbarMenuDropdown">
        <a href="#">Private & Policy</a>
        <a href="#">Donate developer</a>
        <a href="#">Help & support</a>
    </div>

    <!-- ═══════════ LOBBY SCREEN ═══════════════════ -->
    <div id="lobby-screen">
        <div class="lobby-icon">🏍️</div>
        <h1 class="title">RIDING SQUAD</h1>
        <p class="subtitle">Corporate Fleet Tracking</p>
        <div class="lobby-buttons">
            <button class="btn btn-create" id="btnCreateRoom">
                <i class="fa-solid fa-plus"></i> Create Room
            </button>
            <button class="btn btn-join" id="btnJoinRoom">
                <i class="fa-solid fa-right-to-bracket"></i> Join Room
            </button>
        </div>
    </div>

    <!-- ═══════════ CREATE ROOM MODAL ══════════════ -->
    <div class="modal-overlay" id="createModal">
        <div class="modal-card">
            <h3>Create Your Squad</h3>
            <div class="input-field">
                <label>Your Name</label>
                <input type="text" id="createName" placeholder="Enter your rider name" maxlength="30" autocomplete="off" />
            </div>
            <div class="input-field">
                <label>8-Digit Room Password</label>
                <input type="password" id="createPassword" placeholder="Create an 8-digit numeric password"
                maxlength="8" inputmode="numeric" autocomplete="off" />
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelCreate">Cancel</button>
                <button class="btn btn-submit" id="submitCreate">Create Squad</button>
            </div>
        </div>
    </div>

    <!-- ═══════════ JOIN ROOM MODAL ════════════════ -->
    <div class="modal-overlay" id="joinModal">
        <div class="modal-card">
            <h3>Join Existing Squad</h3>
            <div class="input-field">
                <label>Your Name</label>
                <input type="text" id="joinName" placeholder="Enter your rider name" maxlength="30" autocomplete="off" />
            </div>
            <div class="input-field">
                <label>Room ID</label>
                <input type="text" id="joinRoomId" placeholder="Enter the 6-character Room ID"
                maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:2px;" />
            </div>
            <div class="input-field">
                <label>8-Digit Room Password</label>
                <input type="password" id="joinPassword" placeholder="Enter the 8-digit password"
                maxlength="8" inputmode="numeric" autocomplete="off" />
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelJoin">Cancel</button>
                <button class="btn btn-submit" id="submitJoin">Join Squad</button>
            </div>

    </div>

    <!-- ═══════════ CONFIRM CLOSE ROOM MODAL ═══════ -->
    <div class="modal-overlay" id="confirmCloseModal">
        <div class="modal-card">
            <h3>Close This Room?</h3>
            <p style="text-align:center;color:var(--text-secondary);">This will permanently delete the room and kick out all members.</p>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelClose">Go Back</button>
                <button class="btn btn-danger-modal" id="confirmClose">Yes, Delete Room</button>
            </div>
        </div>
    </div>

    <!-- ═══════════ MAP SCREEN ════════════════════ -->
    <div id="map-screen">
        <div id="map"></div>
        <div class="map-header" id="mapHeader">
            <div class="room-info">
                <span style="color:var(--text-secondary);">Room:</span>
                <span class="room-code-badge" id="mapRoomCode">------</span>
                <button class="copy-room-btn" id="copyRoomBtn" title="Copy Room ID">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
            </div>
            <div class="player-count">
                <span class="dot"></span>
                <span>Riders: <strong id="mapPlayerCount">0</strong></span>
            </div>
            <button class="header-btn btn-close-room" id="btnCloseRoom" style="display:none;">
                <i class="fa-solid fa-skull"></i> Close Room
            </button>
            <button class="header-btn btn-leave" id="btnLeaveRoom" style="display:none;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Leave
            </button>
        </div>
        <div class="gps-warning-bar" id="gpsWarningBar">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="gpsWarningText">Weak GPS Signal.</span>
        </div>
        <div class="leaderboard-panel visible" id="leaderboardPanel">
            <div class="panel-header" id="panelHeader">
                <h4><i class="fa-solid fa-users"></i> Squad Members</h4>
                <i class="fa-solid fa-chevron-up toggle-arrow"></i>
            </div>
            <div class="search-container" id="searchContainer">
                <input type="text" class="search-input" id="searchInput" placeholder="Search riders..." />
            </div>
            <div class="panel-content">
                <div class="leaderboard-list" id="leaderboardList"></div>
            </div>
        </div>
        <button class="fab-view-all" id="viewAllBtn" title="Fit all riders on screen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 4 20 4 20 8"/>
                <polyline points="8 20 4 20 4 16"/>
                <polyline points="20 16 20 20 16 20"/>
                <polyline points="4 8 4 4 8 4"/>
            </svg>
        </button>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- Leaflet & Firebase -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, set, get, onValue, remove, update, onDisconnect } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4_B45u4OcMFb356vtrtfhN2wg9ddP1po",
            authDomain: "ride-to-me.firebaseapp.com",
            databaseURL: "https://ride-to-me-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ride-to-me",
            storageBucket: "ride-to-me.firebasestorage.app",
            messagingSenderId: "296562457258",
            appId: "1:296562457258:web:3b46f28b11daccf3bfaed3",
            measurementId: "G-E2XZ763CV0"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const analytics = getAnalytics(app);

        // UI elements
        const lobbyScreen = document.getElementById('lobby-screen');
        const mapScreen = document.getElementById('map-screen');
        const mapRoomCode = document.getElementById('mapRoomCode');
        const mapPlayerCount = document.getElementById('mapPlayerCount');
        const btnCloseRoom = document.getElementById('btnCloseRoom');
        const btnLeaveRoom = document.getElementById('btnLeaveRoom');
        const leaderboardPanel = document.getElementById('leaderboardPanel');
        const leaderboardList = document.getElementById('leaderboardList');
        const searchContainer = document.getElementById('searchContainer');
        const searchInput = document.getElementById('searchInput');
        const panelHeader = document.getElementById('panelHeader');
        const viewAllBtn = document.getElementById('viewAllBtn');
        const toastContainer = document.getElementById('toastContainer');
        const navbarMenuBtn = document.getElementById('navbarMenuBtn');
        const navbarDropdown = document.getElementById('navbarMenuDropdown');

        // Navbar dropdown toggle
        navbarMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            navbarDropdown.classList.toggle('visible');
        });
        document.addEventListener('click', (e) => {
            if (!navbarMenuBtn.contains(e.target) && !navbarDropdown.contains(e.target)) {
                navbarDropdown.classList.remove('visible');
            }
        });

        // Application state
        const SESSION_KEY = 'ridingSquadSession';
        let currentRoomId = null, currentPlayerKey = null, currentDisplayName = null, currentColor = null, isLeader = false;
        let geoWatchId = null, roomUnsubscribe = null, onDisconnectRef = null;
        let markersMap = new Map();
        let isLeaving = false, trackedPlayer = null, isFirstLoad = true;
        let wakeLock = null;
        let lastPushTime = 0, lastPushLat = null, lastPushLng = null;

        // Leaflet map
        const map = L.map('map', { center: [20.5937, 78.9629], zoom: 5, zoomControl: true, attributionControl: true, bounceAtZoomLimits: false });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(map);

        function invalidateMapSize() { setTimeout(() => map.invalidateSize(), 250); }
        window.addEventListener('resize', () => map.invalidateSize());

        // Map interaction class toggling
        let interactionTimeout;
        map.on('movestart zoomstart', () => {
            document.body.classList.add('map-interacting');
            if (interactionTimeout) { clearTimeout(interactionTimeout); interactionTimeout = null; }
        });
        map.on('moveend zoomend', () => {
            if (interactionTimeout) clearTimeout(interactionTimeout);
            interactionTimeout = setTimeout(() => { document.body.classList.remove('map-interacting'); interactionTimeout = null; }, 250);
        });

        // Toast
        function showToast(msg, type = 'info') {
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            toastContainer.appendChild(t);
            setTimeout(() => { if (t.parentNode) t.remove(); }, 3500);
        }

        // Wake lock
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
            }
        }

        // Session storage
        function saveSessionToStorage() {
            localStorage.setItem(SESSION_KEY, JSON.stringify({ roomId: currentRoomId, playerKey: currentPlayerKey, displayName: currentDisplayName, color: currentColor, role: isLeader ? 'leader' : 'member' }));
        }
        function clearSessionFromStorage() { localStorage.removeItem(SESSION_KEY); }
        function getSessionFromStorage() {
            try { const s = JSON.parse(localStorage.getItem(SESSION_KEY)); return s?.roomId ? s : null; } catch { return null; }
        }

        function updateEyeIcons() {
            leaderboardList.querySelectorAll('.eye-icon').forEach(icon => {
                const pk = icon.dataset.player;
                icon.classList.toggle('active', pk === trackedPlayer);
            });
        }

        function sanitizeName(name) { return name.trim().replace(/[\.\$\#\[\]\/]/g, '_').replace(/\s+/g, '_'); }
        function generateRoomId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let res = ''; for (let i = 0; i < 6; i++) res += chars[Math.floor(Math.random() * chars.length)];
            return res;
        }
        function getCurrentPositionPromise() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) reject({ code: -1 });
                navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
            });
        }

        function showLobby() {
            mapScreen.classList.remove('active');
            lobbyScreen.style.display = 'flex';
            leaderboardPanel.classList.remove('visible');
            searchContainer.classList.remove('visible');
            trackedPlayer = null;
            isFirstLoad = true;
        }
        function showMapScreen() {
            lobbyScreen.style.display = 'none';
            mapScreen.classList.add('active');
            leaderboardPanel.classList.add('visible');
            invalidateMapSize();
            requestWakeLock();
        }
        function hideAllModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
        }

        function buildMarkerHTML(color, initial, isLeaderMarker, isSelf) {
            const size = isLeaderMarker ? 38 : 32;
            const borderWidth = isSelf ? 4 : 3;
            const borderColor = isSelf ? '#ffffff' : 'rgba(255,255,255,0.85)';
            const shadowBlur = isSelf ? 18 : 10;
            const pulseAnim = isSelf ? 'markerPulse 2s ease-in-out infinite' : 'none';
            const crownHTML = isLeaderMarker ? '<span style="position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:16px;">👑</span>' : '';
            return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:${borderWidth}px solid ${borderColor};box-shadow:0 0 ${shadowBlur}px ${color};animation:${pulseAnim};position:relative;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;">${crownHTML}${initial}</div>`;
        }
        const pulseStyle = document.createElement('style');
        pulseStyle.textContent = '@keyframes markerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}';
        document.head.appendChild(pulseStyle);

        function formatDistance(m) {
            if (m < 5) return 'Nearby';
            if (m < 1000) return `${Math.round(m)}m`;
            return `${(m / 1000).toFixed(1)} km`;
        }

        function upsertMarker(playerKey, displayName, lat, lng, color, isLeaderMarker, isSelf) {
            if (lat == null || lng == null || isNaN(lat) || isNaN(lng)) return;
            const initial = (displayName || playerKey).charAt(0).toUpperCase();
            const size = isLeaderMarker ? 38 : 32;
            const clickHandler = () => {
                if (isLeaving) return;
                trackedPlayer = (trackedPlayer === playerKey) ? null : playerKey;
                const m = markersMap.get(playerKey);
                if (m && trackedPlayer) map.setView(m.getLatLng(), map.getZoom(), { animate: true });
                updateEyeIcons();
            };
            if (markersMap.has(playerKey)) {
                const marker = markersMap.get(playerKey);
                marker.setLatLng([lat, lng]);
                marker.setIcon(L.divIcon({ html: buildMarkerHTML(color, initial, isLeaderMarker, isSelf), className: 'custom-marker smooth-marker-move', iconSize: [size+6, size+6], iconAnchor: [(size+6)/2, (size+6)/2], tooltipAnchor: [0, -(size+6)/2-6] }));
                marker.off('click').on('click', clickHandler);
                if (trackedPlayer === playerKey && !isLeaving) map.setView([lat, lng], map.getZoom(), { animate: true });
            } else {
                const marker = L.marker([lat, lng], { icon: L.divIcon({ html: buildMarkerHTML(color, initial, isLeaderMarker, isSelf), className: 'custom-marker smooth-marker-move', iconSize: [size+6, size+6], iconAnchor: [(size+6)/2, (size+6)/2], tooltipAnchor: [0, -(size+6)/2-6] }) }).addTo(map);
                marker.on('click', clickHandler);
                markersMap.set(playerKey, marker);
            }
        }
        function removeMarker(key) { if (markersMap.has(key)) { map.removeLayer(markersMap.get(key)); markersMap.delete(key); } }
        function clearAllMarkers() { markersMap.forEach((m, k) => map.removeLayer(m)); markersMap.clear(); }
        function fitAllMarkers() {
            if (markersMap.size === 0) return;
            const bounds = []; markersMap.forEach(m => bounds.push(m.getLatLng()));
            if (bounds.length === 1) map.setView(bounds[0], 16, { animate: true });
            else map.fitBounds(L.latLngBounds(bounds), { padding: [50, 50], maxZoom: 16, animate: true });
        }

        function filterRiderList(term) {
            leaderboardList.querySelectorAll('.leaderboard-item').forEach(item => {
                const name = item.dataset.player || '';
                item.style.display = name.toLowerCase().includes(term) ? '' : 'none';
            });
        }

        function updateLeaderboard(playersData, myLat, myLng) {
            const distances = [];
            if (myLat == null || myLng == null || isNaN(myLat) || isNaN(myLng)) {
                leaderboardList.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:12px;">Waiting for location...</div>';
                searchContainer.classList.remove('visible');
                return;
            }
            const myLatLng = L.latLng(myLat, myLng);
            for (const [key, data] of Object.entries(playersData)) {
                if (!data || typeof data.lat !== 'number' || typeof data.lng !== 'number') continue;
                const isSelf = (key === currentPlayerKey);
                const distText = isSelf ? 'You' : formatDistance(myLatLng.distanceTo([data.lat, data.lng]));
                distances.push({ key, name: data.displayName || key, color: data.color || '#ccc', distText, isSelf });
            }
            distances.sort((a, b) => (a.isSelf ? -1 : b.isSelf ? 1 : 0));
            if (distances.length > 1) searchContainer.classList.add('visible');
            else { searchContainer.classList.remove('visible'); searchInput.value = ''; }
            let html = '';
            distances.forEach(item => {
                html += `<div class="leaderboard-item ${item.isSelf ? 'self' : ''}" data-player="${item.key}">
                    <span class="rider-name"><span class="color-dot" style="background:${item.color};"></span>${item.name}${item.isSelf ? ' (You)' : ''}</span>
                    <span class="distance ${item.distText === 'Nearby' ? 'nearby' : ''}">${item.distText}</span>
                    <span class="eye-icon ${trackedPlayer === item.key ? 'active' : ''}" data-player="${item.key}">${eyeSVG}</span>
                </div>`;
            });
            leaderboardList.innerHTML = html;
            const term = searchInput.value.trim().toLowerCase();
            if (term) filterRiderList(term);
            distances.forEach(item => {
                const marker = markersMap.get(item.key);
                if (marker) {
                    let tip = item.name;
                    if (item.distText !== 'You') tip += ` - ${item.distText}`;
                    const isLeaderM = playersData[item.key]?.role === 'leader';
                    if (isLeaderM && !item.isSelf) tip = '👑 ' + tip;
                    marker.setTooltipContent(tip);
                }
            });
        }

        const eyeSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;

        function setupRoomListener(roomId) {
            if (roomUnsubscribe) { roomUnsubscribe(); roomUnsubscribe = null; }
            const playersRef = ref(db, `rooms/${roomId}/players`);
            roomUnsubscribe = onValue(playersRef, (snap) => {
                if (isLeaving) return;
                const data = snap.val();
                if (!data) {
                    get(ref(db, `rooms/${roomId}`)).then((roomSnap) => {
                        if (!roomSnap.exists() && !isLeaving) {
                            showToast('Room closed by leader.', 'warning');
                            clearSessionFromStorage();
                            forceReturnToLobby();
                        } else if (!isLeaving) {
                            clearAllMarkers();
                            mapPlayerCount.textContent = '0';
                            leaderboardList.innerHTML = '';
                            searchContainer.classList.remove('visible');
                        }
                    });
                    return;
                }
                const activeKeys = new Set();
                for (const [key, val] of Object.entries(data)) {
                    if (val && typeof val.lat === 'number' && typeof val.lng === 'number') {
                        activeKeys.add(key);
                        upsertMarker(key, val.displayName || key, val.lat, val.lng, val.color || '#3b82f6', val.role === 'leader', key === currentPlayerKey);
                    }
                }
                for (const key of markersMap.keys()) if (!activeKeys.has(key)) removeMarker(key);
                mapPlayerCount.textContent = activeKeys.size;
                if (isFirstLoad && markersMap.size > 0) { fitAllMarkers(); isFirstLoad = false; }
                if (currentPlayerKey && data[currentPlayerKey]) {
                    const my = data[currentPlayerKey];
                    isLeader = my.role === 'leader';
                    btnCloseRoom.style.display = isLeader ? 'inline-flex' : 'none';
                    btnLeaveRoom.style.display = isLeader ? 'none' : 'inline-flex';
                }
                const myData = currentPlayerKey ? data[currentPlayerKey] : null;
                updateLeaderboard(data, myData?.lat, myData?.lng);
            });
        }

        function forceReturnToLobby() {
            stopTracking();
            if (roomUnsubscribe) { roomUnsubscribe(); roomUnsubscribe = null; }
            if (onDisconnectRef) { onDisconnectRef.cancel().catch(()=>{}); onDisconnectRef = null; }
            clearAllMarkers();
            currentRoomId = currentPlayerKey = currentDisplayName = null; currentColor = null; isLeader = false;
            mapPlayerCount.textContent = '0'; mapRoomCode.textContent = '------';
            btnCloseRoom.style.display = btnLeaveRoom.style.display = 'none';
            leaderboardList.innerHTML = ''; searchContainer.classList.remove('visible');
            leaderboardPanel.classList.remove('visible');
            trackedPlayer = null; isFirstLoad = true;
            showLobby(); hideAllModals();
            isLeaving = false;
        }

        function stopTracking() {
            if (geoWatchId !== null) { navigator.geolocation.clearWatch(geoWatchId); geoWatchId = null; }
            lastPushTime = 0; lastPushLat = null; lastPushLng = null;
        }

        function startWatchingPosition(roomId, playerKey, displayName, color, role) {
            if (!navigator.geolocation) { showToast('Geolocation not supported', 'error'); return false; }
            stopTracking();
            const playerRef = ref(db, `rooms/${roomId}/players/${playerKey}`);
            if (onDisconnectRef) { onDisconnectRef.cancel().catch(()=>{}); }
            onDisconnectRef = onDisconnect(playerRef);
            onDisconnectRef.remove().catch(()=>{});
            geoWatchId = navigator.geolocation.watchPosition((pos) => {
                const { latitude, longitude, accuracy } = pos.coords;
                if (latitude === 0 && longitude === 0) return;
                if (accuracy > 100) { showToast('Weak GPS signal', 'warning'); return; }
                const now = Date.now();
                let shouldPush = false;
                if (lastPushLat == null) shouldPush = true;
                else {
                    const dist = L.latLng(lastPushLat, lastPushLng).distanceTo([latitude, longitude]);
                    if (dist < 5) return;
                    if (dist > 20 || now - lastPushTime >= 3000) shouldPush = true;
                }
                if (shouldPush) {
                    lastPushLat = latitude; lastPushLng = longitude; lastPushTime = now;
                    update(playerRef, { lat: latitude, lng: longitude, accuracy, displayName, color, role, updatedAt: now });
                }
            }, (err) => {
                let msg = ''; if (err.code === 1) msg = 'Permission denied'; else if (err.code === 2 || err.code === 3) msg = 'GPS unavailable, please go outdoors';
                if (msg) showToast(msg, 'error');
            }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
            return true;
        }

        async function saveInitialPosition(roomId, playerKey, displayName, color, role) {
            try {
                const pos = await getCurrentPositionPromise();
                const { latitude, longitude, accuracy } = pos.coords;
                if (accuracy > 100) throw new Error('Inaccurate');
                await set(ref(db, `rooms/${roomId}/players/${playerKey}`), { lat: latitude, lng: longitude, accuracy, displayName, color, role, updatedAt: Date.now() });
                lastPushLat = latitude; lastPushLng = longitude; lastPushTime = Date.now();
                return true;
            } catch (e) { showToast('GPS inaccurate or denied', 'error'); return false; }
        }

        function assignColor(existingPlayers) {
            const used = new Set(); if (existingPlayers) Object.values(existingPlayers).forEach(p => p?.color && used.add(p.color));
            for (const c of ['#3b82f6','#10b981','#f59e0b','#f97316','#8b5cf6','#ec4899','#14b8a6','#6366f1','#84cc16','#06b6d4']) if (!used.has(c)) return c;
            return '#3b82f6';
        }

        async function removePlayerFromRoom(roomId, playerKey) {
            if (onDisconnectRef) { await onDisconnectRef.cancel().catch(()=>{}); onDisconnectRef = null; }
            await remove(ref(db, `rooms/${roomId}/players/${playerKey}`));
        }

        async function leaveRoom() {
            if (isLeaving) return; isLeaving = true;
            stopTracking(); if (roomUnsubscribe) { roomUnsubscribe(); roomUnsubscribe = null; }
            if (currentRoomId && currentPlayerKey) await removePlayerFromRoom(currentRoomId, currentPlayerKey);
            clearAllMarkers(); clearSessionFromStorage();
            forceReturnToLobby(); showToast('You left the room.');
        }

        async function closeRoom() {
            if (isLeaving) return; isLeaving = true;
            stopTracking(); if (roomUnsubscribe) { roomUnsubscribe(); roomUnsubscribe = null; }
            if (onDisconnectRef) { await onDisconnectRef.cancel().catch(()=>{}); onDisconnectRef = null; }
            if (currentRoomId) await remove(ref(db, `rooms/${currentRoomId}`));
            clearSessionFromStorage(); forceReturnToLobby(); showToast('Room closed.');
        }

        async function restoreSession(session) {
            const roomSnap = await get(ref(db, `rooms/${session.roomId}`));
            if (!roomSnap.exists()) { clearSessionFromStorage(); return false; }
            currentRoomId = session.roomId; currentPlayerKey = session.playerKey; currentDisplayName = session.displayName;
            currentColor = session.color; isLeader = session.role === 'leader'; isFirstLoad = false;
            mapRoomCode.textContent = session.roomId;
            btnCloseRoom.style.display = isLeader ? 'inline-flex' : 'none';
            btnLeaveRoom.style.display = isLeader ? 'none' : 'inline-flex';
            showMapScreen(); hideAllModals();
            try { const pos = await getCurrentPositionPromise(); if (pos.coords.accuracy <= 100) { await set(ref(db, `rooms/${session.roomId}/players/${session.playerKey}`), { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy, displayName: session.displayName, color: session.color, role: session.role, updatedAt: Date.now() }); lastPushLat = pos.coords.latitude; lastPushLng = pos.coords.longitude; lastPushTime = Date.now(); } } catch {}
            startWatchingPosition(session.roomId, session.playerKey, session.displayName, session.color, session.role);
            setupRoomListener(session.roomId);
            return true;
        }

        function checkPersistentSession() {
            const session = getSessionFromStorage();
            if (session) restoreSession(session);
        }

        // Event wiring
        document.getElementById('btnCreateRoom').addEventListener('click', () => {
            if (currentRoomId) { showToast('Already in a room'); return; }
            document.getElementById('createModal').classList.add('active');
        });
        document.getElementById('btnJoinRoom').addEventListener('click', () => {
            if (currentRoomId) { showToast('Already in a room'); return; }
            document.getElementById('joinModal').classList.add('active');
        });
        document.getElementById('cancelCreate').addEventListener('click', () => document.getElementById('createModal').classList.remove('active'));
        document.getElementById('cancelJoin').addEventListener('click', () => document.getElementById('joinModal').classList.remove('active'));
        document.getElementById('submitCreate').addEventListener('click', async () => {
            const name = document.getElementById('createName').value.trim();
            const pw = document.getElementById('createPassword').value.trim();
            if (!name || !/^\d{8}$/.test(pw)) { showToast('Invalid input'); return; }
            const key = sanitizeName(name);
            const roomId = generateRoomId();
            await set(ref(db, `rooms/${roomId}`), { password: pw, leader: name, createdAt: Date.now() });
            currentRoomId = roomId; currentPlayerKey = key; currentDisplayName = name; currentColor = '#ef4444'; isLeader = true;
            const ok = await saveInitialPosition(roomId, key, name, '#ef4444', 'leader');
            if (!ok) { await remove(ref(db, `rooms/${roomId}`)); return; }
            mapRoomCode.textContent = roomId;
            btnCloseRoom.style.display = 'inline-flex'; btnLeaveRoom.style.display = 'none';
            document.getElementById('createModal').classList.remove('active');
            showMapScreen();
            startWatchingPosition(roomId, key, name, '#ef4444', 'leader');
            setupRoomListener(roomId);
            saveSessionToStorage();
        });
        document.getElementById('submitJoin').addEventListener('click', async () => {
            const name = document.getElementById('joinName').value.trim();
            const roomId = document.getElementById('joinRoomId').value.trim().toUpperCase();
            const pw = document.getElementById('joinPassword').value.trim();
            if (!name || roomId.length !== 6 || !/^\d{8}$/.test(pw)) { showToast('Invalid input'); return; }
            const snap = await get(ref(db, `rooms/${roomId}`));
            if (!snap.exists()) { showToast('Room not found'); return; }
            const roomData = snap.val();
            if (roomData.password !== pw) { showToast('Wrong password'); return; }
            const key = sanitizeName(name);
            if (roomData.players && roomData.players[key]) { showToast('Name taken'); return; }
            const color = assignColor(roomData.players);
            currentRoomId = roomId; currentPlayerKey = key; currentDisplayName = name; currentColor = color; isLeader = false;
            const ok = await saveInitialPosition(roomId, key, name, color, 'member');
            if (!ok) return;
            mapRoomCode.textContent = roomId;
            btnCloseRoom.style.display = 'none'; btnLeaveRoom.style.display = 'inline-flex';
            document.getElementById('joinModal').classList.remove('active');
            showMapScreen();
            startWatchingPosition(roomId, key, name, color, 'member');
            setupRoomListener(roomId);
            saveSessionToStorage();
        });
        btnLeaveRoom.addEventListener('click', leaveRoom);
        btnCloseRoom.addEventListener('click', () => document.getElementById('confirmCloseModal').classList.add('active'));
        document.getElementById('cancelClose').addEventListener('click', () => document.getElementById('confirmCloseModal').classList.remove('active'));
        document.getElementById('confirmClose').addEventListener('click', async () => {
            document.getElementById('confirmCloseModal').classList.remove('active');
            await closeRoom();
        });
        viewAllBtn.addEventListener('click', () => { trackedPlayer = null; fitAllMarkers(); updateEyeIcons(); });
        leaderboardList.addEventListener('click', (e) => {
            const icon = e.target.closest('.eye-icon');
            if (!icon) return;
            const pk = icon.dataset.player;
            trackedPlayer = (trackedPlayer === pk) ? null : pk;
            const marker = markersMap.get(pk);
            if (marker && trackedPlayer) map.setView(marker.getLatLng(), map.getZoom(), { animate: true });
            updateEyeIcons();
        });
        map.on('dragstart', () => { trackedPlayer = null; updateEyeIcons(); });
        panelHeader.addEventListener('click', () => {
            leaderboardPanel.classList.toggle('collapsed');
            const arrow = panelHeader.querySelector('.toggle-arrow');
            arrow.classList.toggle('fa-chevron-up');
            arrow.classList.toggle('fa-chevron-down');
        });
        searchInput.addEventListener('input', () => filterRiderList(searchInput.value.trim().toLowerCase()));
        document.getElementById('copyRoomBtn').addEventListener('click', () => {
            const code = mapRoomCode.textContent;
            if (code && code !== '------') { navigator.clipboard.writeText(code).then(() => showToast('Copied!')).catch(() => showToast('Copy failed')); }
        });

        // visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && currentRoomId && currentPlayerKey && !isLeaving) {
                if (!roomUnsubscribe) setupRoomListener(currentRoomId);
                if (geoWatchId === null) startWatchingPosition(currentRoomId, currentPlayerKey, currentDisplayName, currentColor, isLeader ? 'leader' : 'member');
                requestWakeLock();
                invalidateMapSize();
            }
        });

        // init
        const restored = getSessionFromStorage() ? await restoreSession(getSessionFromStorage()) : false;
        if (!restored) {
            showLobby();
            mapRoomCode.textContent = '------';
            mapPlayerCount.textContent = '0';
        }
        hideAllModals();
    </script>
</body>
</html>
